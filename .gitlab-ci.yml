stages:
  - build
  - deploy

build-image:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  only:
    - main
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE" .
    - docker push "$CI_REGISTRY_IMAGE"

deploy-dev:
  image: curlimages/curl
  stage: deploy
  only:
    - main
  script:
    - curl --fail-with-body -X POST $PORTAINER_DEV
