stages:
  - build
  - deploy

build-image:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  only:
    - main
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE" .
    - docker push "$CI_REGISTRY_IMAGE"

build-preview-image:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  except:
    - main
  script:
    - 'echo -e "User-agent: *\nDisallow: /" > public/robots.txt'
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:preview" .
    - docker push "$CI_REGISTRY_IMAGE:preview"

deploy-prod:
  image: curlimages/curl
  stage: deploy
  only:
    - main
  script:
    - curl --fail-with-body -X POST $PORTAINER_PROD

deploy-preview:
  image: curlimages/curl
  stage: deploy
  except:
    - main
  script:
    - curl --fail-with-body -X POST $PORTAINER_PREVIEW
